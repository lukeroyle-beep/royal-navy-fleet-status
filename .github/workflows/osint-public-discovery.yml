name: OSINT public-index discovery

on:
  schedule:
    - cron: "5 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: osint-public-discovery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect-public-indexes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect public publisher indexes
        run: npm run sweep:collect -- --output=osint-sweep-run.json
      - name: Upload discovery ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: osint-public-discovery-${{ github.run_id }}
          path: osint-sweep-run.json
          if-no-files-found: error
          retention-days: 14
