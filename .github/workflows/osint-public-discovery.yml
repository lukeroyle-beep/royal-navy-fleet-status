name: OSINT public-index discovery

on:
  schedule:
    - cron: "5 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect-public-indexes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect public publisher indexes
        run: npm run sweep:collect -- --output=osint-sweep-run.json
      - name: Upload discovery ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: osint-public-discovery-${{ github.run_id }}
          path: osint-sweep-run.json
          if-no-files-found: error
          retention-days: 14
