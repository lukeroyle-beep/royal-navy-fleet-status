name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate append-only ledgers
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          npm run validate:decisions -- --base-ref "$BASE_REF"
          npm run validate:history -- --base-ref "$BASE_REF"
          npm run validate:availability -- --base-ref "$BASE_REF"
          npm run validate:sweeps -- --base-ref "$BASE_REF"
      - run: npm run validate:changes
      - run: npm run build
      - run: npm run build:pages
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages-ready-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
