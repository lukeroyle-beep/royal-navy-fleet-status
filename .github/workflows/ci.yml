name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Test synthetic private-input boundary
        run: npm run test:private-boundary
      - name: Validate append-only ledgers
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          npm run validate:decisions -- --base-ref "$BASE_REF"
          npm run validate:history -- --base-ref "$BASE_REF"
          npm run validate:availability -- --base-ref "$BASE_REF"
          npm run validate:sweeps -- --base-ref "$BASE_REF"
      - run: npm run validate:changes
      - run: npm run build
      - run: npm run build:pages
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run desktop browser regressions
        run: npm run test:browser
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages-ready-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
