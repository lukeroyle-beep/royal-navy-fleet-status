name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:pages
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages-ready-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
